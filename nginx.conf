user nginx;
worker_processes auto;
pid /run/nginx.pid;
# Nginx error records can include a full request/query; keep only safe access logs.
error_log /dev/null crit;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  log_format safe '$remote_addr - - [$time_local] "$request_method $uri" $status';
  access_log /var/log/security/access.log safe;
  sendfile on;
  server {
    listen 4200;
    root /usr/share/nginx/html;
    index index.html;
    location / { try_files $uri $uri/ /index.html; }
  }
}
